
name: JavaScript Array Sum using Reduce

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-javascript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run JavaScript Program
        run: node index.js
